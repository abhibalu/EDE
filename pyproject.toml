[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ede"
version = "0.1.0"
description = "Formal grammar and validators for the 5-node domain extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ede = "ede.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ede"]

[tool.pytest.ini_options]
testpaths = ["tests"]
